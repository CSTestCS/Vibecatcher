name: Build Windows .exe

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache pose models
        uses: actions/cache@v4
        with:
          path: assets/models
          key: mediapipe-models-v2

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build portable .exe and installer
        run: npm run dist
        env:
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vibecatcher-windows
          path: release/*.exe
          if-no-files-found: error

      # Tagged builds (v1.2.3) become a GitHub Release with the .exe files attached.
      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

      # Every push to the default branch refreshes a rolling "latest-build" pre-release.
      - name: Publish rolling build (default branch)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          make_latest: false
          files: release/*.exe
